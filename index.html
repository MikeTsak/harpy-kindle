<!doctype html>
<html lang="en" data-theme="erebus">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Erebus [Harpy Node]</title>
    <meta name="description" content="Harpy Node for the Athens Through-Time LARP." />
    <meta name="application-name" content="Erebus" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light only" />
    <meta name="apple-mobile-web-app-title" content="Erebus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/png" href="/img/ATT-logo(1).png" />
    <link rel="apple-touch-icon" href="/img/ATT-logo(1).png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="Erebus [Harpy Node]" />
    <meta property="og:description" content="Harpy dashboard for the Athens Through-Time LARP." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/img/ATT-logo(1).png" />
    <meta property="og:image:alt" content="Erebus Logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Erebus [Harpy Node]" />
    <meta name="twitter:description" content="Harpy dashboard for the Athens Through-Time LARP." />
    <meta name="twitter:image" content="/img/ATT-logo(1).png" />

    <script>
      if (typeof globalThis === 'undefined') {
        window.globalThis = window;
      }
      window.addEventListener('error', function(e) {
        var msg = e.message || e;
        if (typeof msg === 'string') {
          if (msg.includes('Unexpected token .')) return;
          if (msg.includes('import.meta.resolve not supported')) return;
          if (msg.includes('This script should only be loaded in a browser extension')) return;
        }
        var errDiv = document.getElementById('debug-error');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error';
          errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:#fff;color:#000;z-index:9999;padding:10px;border-bottom:2px solid black;font-family:monospace;font-size:14px;word-break:break-all;';
          document.body.prepend(errDiv);
        }
        errDiv.innerHTML += '<br><b>[ERROR]</b> ' + (e.message || e) + ' (' + e.filename + ':' + e.lineno + ')';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
        if (msg.includes('import.meta.resolve not supported')) return;
        var errDiv = document.getElementById('debug-error');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error';
          errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:#fff;color:#000;z-index:9999;padding:10px;border-bottom:2px solid black;font-family:monospace;font-size:14px;word-break:break-all;';
          document.body.prepend(errDiv);
        }
        errDiv.innerHTML += '<br><b>[PROMISE]</b> ' + msg;
      });
    </script>
  </head>
  <body>
    <noscript style="color:#000; background:#fff; padding:12px; display:block; text-align:center;">
      JAVASCRIPT MODULE REQUIRED FOR CONNECTION.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
